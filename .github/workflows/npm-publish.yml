name: Publish Package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-slim
    permissions:
      id-token: write # Required for OIDC
      contents: write # softprops/action-gh-release
      attestations: write # actions/attest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm i
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
      - name: Extract Version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm publish --no-git-checks
      - name: Rename CLI artifact
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          artifact="dist/${repo}-v${{ env.VERSION }}.js"
          mv dist/cli.js "$artifact"
          echo "CLI_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ env.CLI_ARTIFACT }}
      - name: Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ${{ env.CLI_ARTIFACT }}
          tag_name: v${{ env.VERSION }}
